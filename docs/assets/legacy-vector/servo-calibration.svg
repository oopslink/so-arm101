<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">SO-ARM101舵机调零与标定</title><desc id="d">解释原始编码器数值为何不能直接作为统一关节角度，以及LeRobot通过中间位置、homing offset、全行程最小最大值和标定文件建立坐标映射的流程。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker></defs><rect width="1200" height="760" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d">
<text x="42" y="55" font-size="30" font-weight="bold">调零不是“命令机械臂转到数字0”</text><text x="42" y="88" font-size="18">它是在建立：物理姿态 ↔ 编码器计数 ↔ 软件关节值 的一致映射</text>
<g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="45" y="145" width="245" height="150" rx="14"/><rect x="335" y="145" width="245" height="150" rx="14"/><rect x="625" y="145" width="245" height="150" rx="14"/><rect x="915" y="145" width="240" height="150" rx="14"/></g>
<g text-anchor="middle"><text x="167" y="182" font-size="20" font-weight="bold">① 摆到行程中间</text><path d="M100 245A68 68 0 0 1 235 245" stroke="#7394b4" stroke-width="10" fill="none"/><circle cx="167" cy="245" r="10" fill="#d07a28"/><text x="167" y="275" font-size="16">先支撑、关扭矩、手动摆位</text><text x="457" y="182" font-size="20" font-weight="bold">② 写入归零偏移</text><text x="457" y="220" font-size="18">当前原始计数 → 半圈基准</text><text x="457" y="252" font-size="17">Homing Offset</text><text x="747" y="182" font-size="20" font-weight="bold">③ 扫过完整行程</text><path d="M675 245A72 72 0 0 1 820 245" stroke="#7394b4" stroke-width="10" fill="none"/><path d="M688 225L670 245L694 253M808 225L825 245L802 254" fill="none" stroke="#d07a28" stroke-width="5"/><text x="747" y="275" font-size="16">记录 range_min / range_max</text><text x="1035" y="182" font-size="20" font-weight="bold">④ 保存并复用</text><text x="1035" y="220" font-size="18">写入舵机 + 保存JSON</text><text x="1035" y="252" font-size="17">同一robot.id加载同一标定</text></g>
<g stroke="#56718f" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M290 220H325"/><path d="M580 220H615"/><path d="M870 220H905"/></g>
<rect x="60" y="365" width="1080" height="170" rx="14" fill="#fff" stroke="#b7c8d9" stroke-width="2"/><text x="85" y="402" font-size="21" font-weight="bold">同一个物理姿态，未经标定的数字可能不同</text><line x1="120" y1="470" x2="1080" y2="470" stroke="#9eb5ca" stroke-width="8" stroke-linecap="round"/><circle cx="320" cy="470" r="15" fill="#d07a28"/><circle cx="825" cy="470" r="15" fill="#2f5f91"/><text x="250" y="445" font-size="17">电机A原始计数 1280</text><text x="755" y="445" font-size="17">电机B原始计数 3010</text><path d="M320 485V515H825V485" stroke="#56718f" stroke-width="3" fill="none"/><text x="425" y="510" font-size="17">各自应用offset和行程映射后，可得到可比较的软件角度</text>
<rect x="60" y="585" width="510" height="120" rx="12" fill="#e9f1f9" stroke="#9eb5ca" stroke-width="2"/><text x="85" y="620" font-size="19" font-weight="bold">为什么必须分别标定leader和follower？</text><text x="85" y="650" font-size="17">装配齿位、方向、传动和夹爪结构可能不同；</text><text x="85" y="677" font-size="17">目标是相同姿态得到可对应的软件数值。</text><rect x="630" y="585" width="510" height="120" rx="12" fill="#fff3e7" stroke="#e3aa70" stroke-width="2"/><text x="655" y="620" font-size="19" font-weight="bold" fill="#9a541d">不要做什么</text><text x="655" y="650" font-size="17">不要带扭矩硬掰、撞机械限位、复制别的机械臂JSON，</text><text x="655" y="677" font-size="17">也不要把setup-motors（设ID）误当成calibrate（建坐标）。</text>
</g></svg>
