<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">SO-ARM101总线舵机控制</title><desc id="d">Spark经过USB控制板向同一总线上的六个不同ID舵机写入目标位置等寄存器，并读取当前位置和错误状态。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker></defs><rect width="1200" height="660" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d">
<text x="42" y="55" font-size="30" font-weight="bold">一条总线，六个地址：目标下发与状态回读</text><text x="42" y="88" font-size="18">ID用于找到某个舵机；寄存器名说明读写什么；数值才是目标位置、速度或开关状态</text>
<g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="50" y="145" width="210" height="105" rx="14"/><rect x="330" y="145" width="210" height="105" rx="14"/><rect x="60" y="350" width="150" height="92" rx="12"/><rect x="240" y="350" width="150" height="92" rx="12"/><rect x="420" y="350" width="150" height="92" rx="12"/><rect x="600" y="350" width="150" height="92" rx="12"/><rect x="780" y="350" width="150" height="92" rx="12"/><rect x="960" y="350" width="150" height="92" rx="12"/></g>
<g font-size="19" text-anchor="middle"><text x="155" y="185" font-weight="bold">Spark上的LeRobot</text><text x="155" y="217">计算六个目标</text><text x="435" y="185" font-weight="bold">USB总线控制板</text><text x="435" y="217">转发串行报文</text><text x="135" y="384" font-weight="bold">ID 1</text><text x="135" y="414">肩旋转</text><text x="315" y="384" font-weight="bold">ID 2</text><text x="315" y="414">肩抬升</text><text x="495" y="384" font-weight="bold">ID 3</text><text x="495" y="414">肘</text><text x="675" y="384" font-weight="bold">ID 4</text><text x="675" y="414">腕俯仰</text><text x="855" y="384" font-weight="bold">ID 5</text><text x="855" y="414">腕旋转</text><text x="1035" y="384" font-weight="bold">ID 6</text><text x="1035" y="414">夹爪</text></g>
<g stroke="#56718f" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M260 197H320"/><path d="M435 250V305H1035V340"/><path d="M1035 305H135V340"/><path d="M315 305V340"/><path d="M495 305V340"/><path d="M675 305V340"/><path d="M855 305V340"/></g>
<rect x="650" y="135" width="480" height="122" rx="12" fill="#e9f1f9" stroke="#9eb5ca" stroke-width="2"/><text x="675" y="170" font-size="20" font-weight="bold">一次写命令的直观形式</text><text x="675" y="202" font-size="18">ID 4 + Goal_Position + 目标值</text><text x="675" y="231" font-size="17">常见读写项：当前位置、目标位置、扭矩开关、速度、错误状态</text>
<g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="75" y="515" width="490" height="95" rx="12"/><rect x="635" y="515" width="490" height="95" rx="12"/></g><text x="100" y="550" font-size="19" font-weight="bold">上位机控制周期</text><text x="100" y="580" font-size="17">读状态 → 算目标 → 写六个目标；30 Hz是本实验期望频率</text><text x="660" y="550" font-size="19" font-weight="bold">每个舵机的内部闭环</text><text x="660" y="580" font-size="17">在两次上位机命令之间仍自行跟踪最后目标，不等同于VLA推理频率</text>
</g></svg>
