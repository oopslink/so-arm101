<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">训练与推理对比</title><desc id="d">训练读取示范、计算损失并更新模型；推理读取实时观测、生成动作、驱动机械臂形成闭环，不更新参数。</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker></defs><rect width="1200" height="650" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d"><text x="42" y="55" font-size="30" font-weight="bold">同一个模型，两种不同阶段</text>
<rect x="45" y="100" width="530" height="485" rx="16" fill="#fff" stroke="#b7c8d9" stroke-width="2"/><rect x="625" y="100" width="530" height="485" rx="16" fill="#fff" stroke="#b7c8d9" stroke-width="2"/><text x="75" y="145" font-size="26" font-weight="bold">训练：从示范中改参数</text><text x="655" y="145" font-size="26" font-weight="bold">推理：用固定参数做动作</text>
<g fill="#e4edf7" stroke="#7f9dba" stroke-width="2"><rect x="105" y="190" width="180" height="72" rx="10"/><rect x="335" y="190" width="180" height="72" rx="10"/><rect x="220" y="315" width="180" height="72" rx="10"/><rect x="105" y="445" width="180" height="72" rx="10"/><rect x="685" y="190" width="180" height="72" rx="10"/><rect x="915" y="190" width="180" height="72" rx="10"/><rect x="800" y="315" width="180" height="72" rx="10"/><rect x="685" y="445" width="180" height="72" rx="10"/><rect x="915" y="445" width="180" height="72" rx="10"/></g>
<g font-size="19" text-anchor="middle"><text x="195" y="222">示范观测</text><text x="195" y="246">图像+状态+文字</text><text x="425" y="222">示范未来动作</text><text x="425" y="246">监督目标</text><text x="310" y="347">PI0训练预测</text><text x="310" y="371">动作生成</text><text x="195" y="477">损失函数</text><text x="195" y="501">比较差异</text><text x="775" y="222">实时观测</text><text x="775" y="246">图像+状态+文字</text><text x="1005" y="222">PI0策略</text><text x="1005" y="246">参数不更新</text><text x="890" y="347">动作后处理</text><text x="890" y="371">还原真实量纲</text><text x="775" y="477">Follower执行</text><text x="775" y="501">舵机跟随目标</text><text x="1005" y="477">新观测</text><text x="1005" y="501">相机+关节反馈</text></g>
<g stroke="#56718f" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M195 262L270 315"/><path d="M425 262L350 315"/><path d="M270 387L210 445"/><path d="M195 445V410H425V275"/><path d="M865 226H910"/><path d="M1005 262L930 315"/><path d="M850 387L790 445"/><path d="M865 481H910"/><path d="M1005 445V410H665V225H680"/></g>
<text x="335" y="492" font-size="17">反向传播 → 更新参数</text><text x="75" y="552" font-size="17">主要看：loss、梯度、验证结果</text><text x="655" y="552" font-size="17">主要看：目标、实际动作、任务成功率</text><text x="42" y="625" font-size="18">真机失败不会自动进入下一次训练；要保存、筛选并重新训练，模型才可能学到新的经验。</text></g></svg>
