<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d"><title id="t">分批采集与编码流程</title><desc id="d">每批十个episode先异步写PNG，批末统一编码两路视频并检查，通过后开始下一批；失败时隔离当前批。</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker></defs><rect width="1200" height="570" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d"><text x="42" y="55" font-size="30" font-weight="bold">为什么分成每批10条：把失败限制在一个小范围</text>
<text x="42" y="95" font-size="18">以下为本实验的批量保存策略；10是工程折中，不是模型要求。</text>
<rect x="45" y="135" width="750" height="145" rx="14" fill="#fff" stroke="#b7c8d9" stroke-width="2"/><text x="68" y="170" font-size="21" font-weight="bold">Batch 001：采集阶段</text>
<g fill="#dfeafa" stroke="#7f9dba" stroke-width="2"><rect x="70" y="195" width="50" height="50" rx="8"/><rect x="138" y="195" width="50" height="50" rx="8"/><rect x="206" y="195" width="50" height="50" rx="8"/><rect x="274" y="195" width="50" height="50" rx="8"/><rect x="342" y="195" width="50" height="50" rx="8"/><rect x="410" y="195" width="50" height="50" rx="8"/><rect x="478" y="195" width="50" height="50" rx="8"/><rect x="546" y="195" width="50" height="50" rx="8"/><rect x="614" y="195" width="50" height="50" rx="8"/><rect x="682" y="195" width="50" height="50" rx="8"/></g><g font-size="16" text-anchor="middle"><text x="95" y="226">0</text><text x="163" y="226">1</text><text x="231" y="226">2</text><text x="299" y="226">3</text><text x="367" y="226">4</text><text x="435" y="226">5</text><text x="503" y="226">6</text><text x="571" y="226">7</text><text x="639" y="226">8</text><text x="707" y="226">9</text></g><text x="68" y="265" font-size="16">每条：控制循环继续运行，图像由writer异步保存为PNG</text>
<rect x="865" y="135" width="290" height="145" rx="14" fill="#fff3df" stroke="#df8a35" stroke-width="2"/><text x="890" y="170" font-size="21" font-weight="bold">批末统一编码</text><text x="890" y="207" font-size="17">wrist PNG → H.264</text><text x="890" y="237" font-size="17">side PNG → H.264</text><text x="890" y="265" font-size="16">此时采集暂停等待</text>
<path d="M795 207H855" stroke="#56718f" stroke-width="3" marker-end="url(#a)"/>
<rect x="380" y="345" width="440" height="145" rx="14" fill="#e4f3ea" stroke="#659477" stroke-width="2"/><text x="405" y="383" font-size="21" font-weight="bold">结构 + 解码 + 人工语义检查</text><text x="405" y="420" font-size="17">episode / frame索引连续？视频可解码？</text><text x="405" y="450" font-size="17">抓取、三次敲击、放回是否真的完成？</text><path d="M1010 280L820 365" stroke="#56718f" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M380 420H270V510H935V430H830" stroke="#56718f" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="72" y="405" font-size="18" font-weight="bold">失败</text><text x="72" y="435" font-size="16">保留现场、隔离本批、诊断恢复</text><text x="850" y="405" font-size="18" font-weight="bold">通过</text><text x="850" y="435" font-size="16">开始Batch 002</text><text x="42" y="545" font-size="17">独立批次减少连锁损失，但不能替代底层metadata修复和逐批验收。</text></g></svg>
