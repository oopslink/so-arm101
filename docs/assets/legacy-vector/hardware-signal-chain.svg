<g font-size="17"><text x="78" y="178">6个舵机 → 人的示范输入</text><text x="78" y="408">6个舵机 ↔ 状态与目标</text><text x="445" y="294">LeRobot连接设备、对齐数据、</text><text x="445" y="323">调用模型并下发动作</text><text x="895" y="164">wrist近景 + side全局</text><text x="895" y="334">部署时替代人的动作输入</text><text x="895" y="504">保存经验与诊断证据</text></g>
