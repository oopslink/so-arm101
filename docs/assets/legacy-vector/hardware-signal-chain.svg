<g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="55" y="110" width="245" height="105" rx="12"/><rect x="55" y="340" width="245" height="105" rx="12"/><rect x="420" y="220" width="320" height="150" rx="12"/><rect x="870" y="90" width="265" height="115" rx="12"/><rect x="870" y="260" width="265" height="115" rx="12"/><rect x="870" y="430" width="265" height="115" rx="12"/></g>
