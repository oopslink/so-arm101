<title id="t">SO-ARM101硬件和信号链</title><desc id="d">采集时主臂、从臂和相机连接Spark，外部电源给舵机供电；部署时模型代替主臂产生动作。</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker></defs>
