<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">一个LeRobot数据帧的组成</title><desc id="d">同一个时间点包含腕部与侧面图像、六维当前状态、六维目标动作、任务文本和索引时间。</desc><rect width="1200" height="620" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d"><text x="42" y="55" font-size="30" font-weight="bold">一条演示不是一张图：episode 由连续 frame 组成</text>
<rect x="45" y="105" width="1110" height="76" rx="12" fill="#dfeafa"/><text x="75" y="138" font-size="21" font-weight="bold">Episode 7</text><g fill="#fff" stroke="#7f9dba" stroke-width="2"><rect x="235" y="122" width="120" height="42" rx="8"/><rect x="380" y="122" width="120" height="42" rx="8"/><rect x="525" y="122" width="120" height="42" rx="8"/><rect x="670" y="122" width="120" height="42" rx="8"/><rect x="815" y="122" width="120" height="42" rx="8"/></g><g font-size="16"><text x="265" y="149">frame 0</text><text x="404" y="149">frame 1</text><text x="549" y="149">frame 2</text><text x="696" y="149">frame …</text><text x="832" y="149">frame 632</text></g>
<text x="45" y="230" font-size="23" font-weight="bold">放大其中一个时间点 t</text><g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="45" y="260" width="255" height="210" rx="12"/><rect x="330" y="260" width="255" height="210" rx="12"/><rect x="615" y="260" width="255" height="210" rx="12"/><rect x="900" y="260" width="255" height="210" rx="12"/></g>
<g font-size="19" font-weight="bold"><text x="65" y="294">两路图像</text><text x="350" y="294">observation.state</text><text x="635" y="294">action</text><text x="920" y="294">任务与索引</text></g>
<rect x="70" y="320" width="88" height="75" fill="#dce8f3"/><circle cx="114" cy="356" r="20" fill="#f2a65a"/><rect x="180" y="320" width="88" height="75" fill="#e8efe5"/><path d="M190 380L225 332L258 380" fill="none" stroke="#638060" stroke-width="8"/><text x="72" y="425" font-size="16">wrist　　side</text><text x="72" y="450" font-size="15">同一时刻的互补视角</text>
<g font-size="16"><text x="350" y="332">[肩转，肩抬，肘，</text><text x="350" y="360"> 腕俯仰，腕旋转，</text><text x="350" y="388"> 夹爪开合]</text><text x="350" y="440">现在在哪里</text><text x="635" y="332">同样的6维顺序</text><text x="635" y="360">原始记录：控制目标</text><text x="635" y="388">future4：稍后的实测状态</text><text x="635" y="440">接下来要去哪里</text><text x="920" y="332">task / task_index</text><text x="920" y="360">episode_index</text><text x="920" y="388">frame_index / timestamp</text><text x="920" y="440">身份与时间关系</text></g>
<path d="M580 365H610" stroke="#56718f" stroke-width="3"/><text x="45" y="535" font-size="19">训练依赖的是图像、状态、动作和时间的同步关系；只有MP4，或只有关节表，都不是完整示范。</text><text x="45" y="574" font-size="17">本实验：80 episodes，50,596 frames，30 FPS；每个frame有两路图像引用。</text></g></svg>
