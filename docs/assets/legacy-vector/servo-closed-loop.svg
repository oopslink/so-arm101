<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">总线舵机内部闭环</title><desc id="d">上位机发送目标位置，舵机内部控制器比较目标与编码器反馈，驱动电机和减速齿轮带动关节，并持续反馈当前位置。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#56718f"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#d07a28"/></marker></defs>
<rect width="1200" height="680" rx="22" fill="#f4f7fb"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#17304d">
<text x="42" y="55" font-size="30" font-weight="bold">舵机 = 电机 + 齿轮 + 编码器 + 内部控制器</text><text x="42" y="88" font-size="18">电脑给“目标位置”，舵机自己反复纠偏；它不是收到一次电压就随便转动的裸电机</text>
<g fill="#fff" stroke="#b7c8d9" stroke-width="2"><rect x="50" y="170" width="190" height="105" rx="14"/><rect x="315" y="170" width="215" height="105" rx="14"/><rect x="605" y="170" width="210" height="105" rx="14"/><rect x="890" y="170" width="250" height="105" rx="14"/><rect x="665" y="385" width="210" height="100" rx="14"/></g>
<g font-size="20" text-anchor="middle"><text x="145" y="210" font-weight="bold">Spark / 控制板</text><text x="145" y="242">目标位置 q*</text><text x="422" y="205" font-weight="bold">舵机控制器</text><text x="422" y="235">误差 e = q* − q</text><text x="422" y="260">决定驱动力</text><text x="710" y="210" font-weight="bold">电机 + 减速齿轮</text><text x="710" y="242">产生转矩并减速</text><text x="1015" y="210" font-weight="bold">机械臂关节</text><text x="1015" y="242">负载、摩擦、碰撞</text><text x="770" y="422" font-weight="bold">位置编码器</text><text x="770" y="454">测得当前位置 q</text></g>
<g stroke="#56718f" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M240 222H305"/><path d="M530 222H595"/><path d="M815 222H880"/><path d="M1015 275V435H885"/><path d="M665 435H422V285"/></g>
<text x="260" y="207" font-size="16">总线报文</text><text x="930" y="414" font-size="16">真实运动反馈</text>
<rect x="70" y="545" width="1060" height="85" rx="12" fill="#fff3e7" stroke="#e3aa70" stroke-width="2"/><text x="95" y="578" font-size="20" font-weight="bold" fill="#9a541d">重要边界</text><text x="95" y="608" font-size="18">舵机会努力保持目标位置，但能力受电压、速度、转矩、电流、温度和机械结构限制；顶死时继续加力会过载，不会自动“想办法绕开”。</text>
<path d="M420 150V115H1015V150" stroke="#d07a28" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="650" y="130" font-size="17" fill="#9a541d">内部闭环持续工作</text>
</g></svg>
